<template>

    <div class="wizard-shell">

        <template if:true={isLoading}>

            <div class="loading-state">
                <lightning-spinner
                    alternative-text="Loading Work Order review"
                    size="medium">
                </lightning-spinner>
            </div>

        </template>


        <template if:false={isLoading}>

            <template if:true={errorMessage}>

                <div class="error-state">

                    <lightning-icon
                        icon-name="utility:error"
                        size="small"
                        class="error-icon">
                    </lightning-icon>

                    <div>
                        <h2>Unable to Load Work Order Review</h2>
                        <p>{errorMessage}</p>
                    </div>

                </div>

            </template>


            <template if:false={errorMessage}>

                <!-- =====================================================
                     HEADER
                     ===================================================== -->

                <header class="wizard-header">

                    <div class="header-content">

                        <div class="header-icon">

                            <lightning-icon
                                icon-name="standard:work_order"
                                size="small">
                            </lightning-icon>

                        </div>

                        <div>

                            <p class="eyebrow">
                                Manager Review
                            </p>

                            <h1>
                                Review Work Order
                            </h1>

                            <p class="header-subtitle">
                                Review the AI-assisted service plan before
                                approving this Work Order.
                            </p>

                            <div class="header-meta">

                                <span class="work-order-number">
                                    {workOrderNumber}
                                </span>

                                <span class="header-meta-divider"></span>

                                <span class="header-machine">
                                    <lightning-icon
                                        icon-name="standard:asset_object"
                                        size="xx-small">
                                    </lightning-icon>
                                    <span>{machineLabel}</span>
                                </span>

                                <span class="header-meta-divider"></span>

                                <span class="header-serial">
                                    S/N {serialNumber}
                                </span>

                                <span class="header-meta-divider"></span>

                                <span class={priorityClass}>
                                    {priority}
                                </span>

                                <span class={previousFailureClass}>
                                    {previousFailureLabel}
                                </span>

                            </div>

                        </div>

                    </div>


                    <button
                        class="regenerate-button"
                        type="button"
                        onclick={handleRegenerate}
                        disabled={isRegenerating}>

                        <lightning-icon
                            icon-name="utility:refresh"
                            size="xx-small"
                            class={regenerateIconClass}>
                        </lightning-icon>

                        <template if:false={isRegenerating}>
                            <span>Regenerate AI Proposal</span>
                        </template>

                        <template if:true={isRegenerating}>
                            <span>Regenerating...</span>
                        </template>

                    </button>

                </header>

                <template if:true={regenerationErrorMessage}>

                    <div class="regeneration-error" role="alert">
                        <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                        <span>{regenerationErrorMessage}</span>
                    </div>

                </template>

                <section class="context-strip">

                    <div class="context-panel customer-panel">

                        <div class="context-panel-header">
                            <div class="context-icon customer-context-icon">
                                <lightning-icon
                                    icon-name="standard:account"
                                    size="small">
                                </lightning-icon>
                            </div>

                            <div class="context-details">
                                <p class="context-label">Customer</p>
                                <h2>{accountName}</h2>
                            </div>
                        </div>

                        <div class="context-info-grid">
                            <span class="context-info-label">Submitted by</span>
                            <strong>{contactName}</strong>

                            <template if:true={hasContactTitle}>
                                <span class="context-info-label">Role</span>
                                <span>{contactTitle}</span>
                            </template>

                            <template if:true={hasContactEmail}>
                                <span class="context-info-label">Email</span>
                                <span>{contactEmail}</span>
                            </template>

                            <template if:true={hasContactPhone}>
                                <span class="context-info-label">Phone</span>
                                <span>{contactPhone}</span>
                            </template>
                        </div>

                    </div>


                    <template if:true={hasCaseNumber}>

                        <div class="context-panel case-panel">

                            <div class="context-panel-header">
                                <div class="context-icon case-context-icon">
                                    <lightning-icon
                                        icon-name="standard:case"
                                        size="small">
                                    </lightning-icon>
                                </div>

                                <div class="context-details">
                                    <p class="context-label">Service Case</p>
                                    <h2>{caseNumber}</h2>
                                </div>
                            </div>

                            <div class="context-info-grid">
                                <span class="context-info-label">Subject</span>
                                <span>{caseSubject}</span>

                                <span class="context-info-label">Status</span>
                                <span>
                                    <span class={caseStatusClass}>
                                        {caseStatus}
                                    </span>
                                </span>

                                <template if:true={reviewData.errorCode}>
                                    <span class="context-info-label">Error Code</span>
                                    <strong>{reviewData.errorCode}</strong>
                                </template>

                                <template if:true={reviewData.dateReported}>
                                    <span class="context-info-label">Reported</span>
                                    <lightning-formatted-date-time
                                        value={reviewData.dateReported}
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        hour="numeric"
                                        minute="2-digit">
                                    </lightning-formatted-date-time>
                                </template>
                            </div>

                        </div>

                    </template>

                </section>


                <!-- =====================================================
                     PROGRESS
                     ===================================================== -->

                <div class="progress-shell">

                    <div class={stepOneClass}>

                        <div class="step-circle">
                            1
                        </div>

                        <div>
                            <strong>
                                Problem &amp; Assessment
                            </strong>

                            <span>
                                Understand the issue
                            </span>
                        </div>

                    </div>


                    <div class="progress-line"></div>


                    <div class={stepTwoClass}>

                        <div class="step-circle">
                            2
                        </div>

                        <div>
                            <strong>
                                Fix &amp; Tools
                            </strong>

                            <span>
                                Prepare the repair
                            </span>
                        </div>

                    </div>


                    <div class="progress-line"></div>


                    <div class={stepThreeClass}>

                        <div class="step-circle">3</div>

                        <div>
                            <strong>Parts to Order</strong>
                            <span>Plan required parts</span>
                        </div>

                    </div>

                    <div class="progress-line"></div>

                    <div class={stepFourClass}>

                        <div class="step-circle">4</div>

                        <div>
                            <strong>Approval</strong>
                            <span>Finalize the Work Order</span>
                        </div>

                    </div>

                </div>


                <!-- =====================================================
                     STEP 1
                     ===================================================== -->

                <template if:true={isStepOne}>

                    <main class="wizard-content">

                        <div class="step-heading">

                            <p class="eyebrow">
                                Step 1 of 4
                            </p>

                            <h2>
                                Problem &amp; AI Assessment
                            </h2>

                            <p>
                                Understand what happened, compare relevant
                                service history, and review the proposed
                                repair approach.
                            </p>

                        </div>


                        <!-- WHAT HAPPENED -->

                        <section class="content-card problem-card">

                            <div class="card-header">

                                <div>

                                    <p class="section-kicker problem-kicker">
                                        What happened?
                                    </p>

                                    <h3>
                                        Problem Summary
                                    </h3>

                                </div>

                                <button
                                    class="icon-action"
                                    type="button"
                                    title="Edit Problem Summary"
                                    disabled>

                                    <lightning-icon
                                        icon-name="utility:edit"
                                        size="xx-small">
                                    </lightning-icon>

                                </button>

                            </div>

                            <p class="primary-copy">
                                {problemSummary}
                            </p>

                        </section>


                        <!-- HISTORICAL PRECEDENT -->

                        <section class="content-card history-card">

                            <div class="history-heading">

                                <div>

                                    <p class="section-kicker history-kicker">
                                        Has this happened before?
                                    </p>

                                    <h3>
                                        {precedentHeading}
                                    </h3>

                                </div>

                                <lightning-icon
                                    icon-name="utility:history"
                                    size="small">
                                </lightning-icon>

                            </div>


                            <template if:true={hasHistoricalPrecedents}>

                                <lightning-accordion
                                    allow-multiple-sections-open>

                                    <lightning-accordion-section
                                        name="historical-precedents"
                                        label={precedentHeading}>

                                        <div class="precedent-list">

                                            <template
                                                for:each={precedents}
                                                for:item="precedent">

                                                <article
                                                    key={precedent.maintenanceLogId}
                                                    class="precedent-card">


                                                    <div class="precedent-header">

                                                        <div>

                                                            <p class="precedent-number">
                                                                Historical Precedent
                                                                {precedent.displayNumber}
                                                            </p>

                                                            <h4>
                                                                {precedent.machineLabel}
                                                            </h4>

                                                            <div class="precedent-meta">

                                                                <lightning-formatted-date-time
                                                                    value={precedent.maintenanceDate}
                                                                    year="numeric"
                                                                    month="short"
                                                                    day="2-digit">
                                                                </lightning-formatted-date-time>

                                                                <span class={precedent.sameAssetClass}>
                                                                    {precedent.sameAssetLabel}
                                                                </span>

                                                            </div>

                                                        </div>

                                                    </div>


                                                    <div class="precedent-section">

                                                        <h5>
                                                            Why It’s Relevant
                                                        </h5>

                                                        <p>
                                                            {precedent.whyRelevant}
                                                        </p>

                                                    </div>


                                                    <template if:true={precedent.hasRootCause}>

                                                        <div class="precedent-section">

                                                            <h5>
                                                                Recorded Root Cause
                                                            </h5>

                                                            <p>
                                                                {precedent.rootCause}
                                                            </p>

                                                        </div>

                                                    </template>


                                                    <template if:true={precedent.hasSuccessfulRepair}>

                                                        <div class="precedent-section">

                                                            <h5>
                                                                Successful Repair
                                                            </h5>

                                                            <p>
                                                                {precedent.successfulRepair}
                                                            </p>

                                                        </div>

                                                    </template>


                                                    <template if:true={precedent.hasPartsUsed}>

                                                        <div class="precedent-section">

                                                            <h5>
                                                                Parts Used
                                                            </h5>

                                                            <p>
                                                                {precedent.partsUsed}
                                                            </p>

                                                        </div>

                                                    </template>


                                                    <template if:true={precedent.hasTechnicianNotes}>

                                                        <div class="precedent-section">

                                                            <h5>
                                                                Technician Observation
                                                            </h5>

                                                            <p>
                                                                {precedent.technicianNotes}
                                                            </p>

                                                        </div>

                                                    </template>


                                                    <template if:true={precedent.hasLaborHours}>

                                                        <div class="precedent-section compact-section">

                                                            <h5>
                                                                Labor Hours
                                                            </h5>

                                                            <p>
                                                                {precedent.laborHours}
                                                            </p>

                                                        </div>

                                                    </template>


                                                    <div class="precedent-section outcome-section">

                                                        <h5>
                                                            Outcome
                                                        </h5>

                                                        <p>
                                                            {precedent.outcome}
                                                        </p>

                                                    </div>

                                                </article>

                                            </template>

                                        </div>


                                        <div class="history-disclaimer">

                                            <lightning-icon
                                                icon-name="utility:info"
                                                size="xx-small">
                                            </lightning-icon>

                                            <p>
                                                Historical repairs are supporting
                                                evidence. Verify the current machine
                                                condition before finalizing the
                                                repair plan.
                                            </p>

                                        </div>

                                    </lightning-accordion-section>

                                </lightning-accordion>

                            </template>


                            <template if:false={hasHistoricalPrecedents}>

                                <div class="empty-history">

                                    <lightning-icon
                                        icon-name="utility:info_alt"
                                        size="small">
                                    </lightning-icon>

                                    <p>
                                        {noHistoryMessage}
                                    </p>

                                </div>

                            </template>

                        </section>


                        <!-- AI RECOMMENDATION -->

                        <section class="content-card ai-card">

                            <div class="card-header">

                                <div>

                                    <p class="section-kicker ai-kicker">
                                        What does AI recommend?
                                    </p>

                                    <h3>
                                        AI Recommended Solution
                                    </h3>

                                </div>

                                <div class="ai-badge">

                                    <lightning-icon
                                        icon-name="utility:einstein"
                                        size="xx-small">
                                    </lightning-icon>

                                    <span>
                                        AI Assisted
                                    </span>

                                </div>

                            </div>


                            <div class="recommended-solution">

                                <p>
                                    {recommendedSolution}
                                </p>

                            </div>

                        </section>

                    </main>


                    <footer class="wizard-footer">

                        <button
                            type="button"
                            class="secondary-button"
                            onclick={handleCancel}>

                            Cancel

                        </button>


                        <button
                            type="button"
                            class="primary-button"
                            onclick={handleContinue}>

                            Continue to Fix &amp; Tools

                            <lightning-icon
                                icon-name="utility:chevronright"
                                size="xx-small">
                            </lightning-icon>

                        </button>

                    </footer>

                </template>


                <!-- =====================================================
                     STEP 2
                     ===================================================== -->

                <template if:true={isStepTwo}>

                    <main class="wizard-content">

                        <div class="step-heading">

                            <p class="eyebrow">
                                Step 2 of 4
                            </p>

                            <h2>
                                Fix &amp; Tools
                            </h2>

                            <p>
                                Refine the technician-facing repair direction
                                and prepare the tools needed for the visit.
                            </p>

                        </div>


                        <section class="content-card fix-summary-card">

                            <div class="card-header">

                                <div>

                                    <p class="section-kicker fix-kicker">
                                        Repair direction
                                    </p>

                                    <h3>
                                        Recommended Fix Summary
                                    </h3>

                                    <p class="field-helper">
                                        Keep this concise. This becomes the
                                        technician-facing repair direction.
                                    </p>

                                </div>

                                <div class="manager-edit-badge">

                                    <lightning-icon
                                        icon-name="utility:edit"
                                        size="xx-small">
                                    </lightning-icon>

                                    <span>Manager Editable</span>

                                </div>

                            </div>


                            <div class="fix-editor">

                                <textarea
                                    class="fix-summary-input"
                                    maxlength="255"
                                    value={recommendedFixSummary}
                                    oninput={handleRecommendedFixChange}
                                    aria-label="Recommended Fix Summary"
                                    disabled={isRegenerating}>
                                </textarea>

                                <div class={recommendedFixSummaryCounterClass}>
                                    {recommendedFixSummaryLength} / 255
                                </div>

                            </div>

                        </section>


                        <section class="content-card tools-card">

                            <div class="card-header">

                                <div>

                                    <p class="section-kicker tools-kicker">
                                        Visit preparation
                                    </p>

                                    <h3>
                                        Tools to Bring
                                    </h3>

                                    <p class="field-helper">
                                        Review the AI suggestions and add or
                                        remove tools before dispatch.
                                    </p>

                                </div>

                                <div class="tool-count-badge">
                                    {recommendedTools.length} selected
                                </div>

                            </div>


                            <template if:true={hasRecommendedTools}>

                                <div class="tool-list">

                                    <template
                                        for:each={recommendedTools}
                                        for:item="tool">

                                        <div
                                            key={tool.id}
                                            class="tool-chip">

                                            <div class="tool-chip-main">

                                                <div class="tool-icon">

                                                    <lightning-icon
                                                        icon-name="utility:setup"
                                                        size="xx-small">
                                                    </lightning-icon>

                                                </div>

                                                <span>{tool.name}</span>

                                            </div>

                                            <button
                                                type="button"
                                                class="remove-tool-button"
                                                data-id={tool.id}
                                                title="Remove tool"
                                                onclick={handleRemoveTool}
                                                disabled={isRegenerating}>

                                                <lightning-icon
                                                    icon-name="utility:close"
                                                    size="xx-small">
                                                </lightning-icon>

                                            </button>

                                        </div>

                                    </template>

                                </div>

                            </template>


                            <template if:false={hasRecommendedTools}>

                                <div class="empty-tools">

                                    <lightning-icon
                                        icon-name="utility:info_alt"
                                        size="small">
                                    </lightning-icon>

                                    <div>
                                        <strong>No tools identified yet</strong>
                                        <p>
                                            Add any tools the technician should
                                            bring for this service visit.
                                        </p>
                                    </div>

                                </div>

                            </template>


                            <div class="add-tool-row">

                                <div class="add-tool-input-wrap">

                                    <lightning-icon
                                        icon-name="utility:add"
                                        size="xx-small">
                                    </lightning-icon>

                                    <input
                                        type="text"
                                        class="add-tool-input"
                                        placeholder="Add a tool..."
                                        value={newToolName}
                                        oninput={handleNewToolChange}
                                        onkeydown={handleToolKeyDown}
                                        disabled={isRegenerating}>

                                </div>

                                <button
                                    type="button"
                                    class="add-tool-button"
                                    onclick={handleAddTool}
                                    disabled={isRegenerating}>
                                    Add Tool
                                </button>

                            </div>

                        </section>

                    </main>


                    <footer class="wizard-footer">

                        <button
                            type="button"
                            class="secondary-button"
                            onclick={handleBack}>

                            <lightning-icon
                                icon-name="utility:chevronleft"
                                size="xx-small">
                            </lightning-icon>

                            Back

                        </button>


                        <button
                            type="button"
                            class="primary-button"
                            onclick={handleContinueToParts}>

                            Continue to Parts to Order

                            <lightning-icon
                                icon-name="utility:chevronright"
                                size="xx-small">
                            </lightning-icon>

                        </button>

                    </footer>

                </template>


                <!-- =====================================================
                     STEP 3 - PARTS TO ORDER
                     ===================================================== -->

                <template if:true={isStepThree}>

                    <main class="wizard-content">

                        <div class="step-heading">
                            <p class="eyebrow">Step 3 of 4</p>
                            <h2>Parts to Order</h2>
                            <p>
                                Select the parts that should be prepared or ordered before
                                this Work Order is dispatched. Nothing is ordered from this screen.
                            </p>
                        </div>

                        <section class="content-card ai-parts-card">
                            <div class="card-header">
                                <div>
                                    <p class="section-kicker ai-parts-kicker">AI guidance</p>
                                    <h3>AI Suggested Parts</h3>
                                    <p class="field-helper">
                                        Use this recommendation as a reference. Select the actual
                                        catalog parts required for the repair below.
                                    </p>
                                </div>
                                <div class="ai-badge">
                                    <lightning-icon icon-name="utility:einstein" size="xx-small"></lightning-icon>
                                    <span>AI Assisted</span>
                                </div>
                            </div>
                            <div class="ai-parts-copy">{recommendedPartsDisplay}</div>
                        </section>

                        <section class="content-card parts-catalog-card">
                            <div class="parts-catalog-header">
                                <div>
                                    <p class="section-kicker parts-kicker">Repair planning</p>
                                    <h3>Part Catalog</h3>
                                    <p class="field-helper">
                                        Showing active parts for {manufacturer} machines.
                                    </p>
                                </div>

                                <div class="parts-search-wrap">
                                    <lightning-icon icon-name="utility:search" size="xx-small"></lightning-icon>
                                    <input
                                        type="search"
                                        class="parts-search-input"
                                        placeholder="Search parts..."
                                        value={partSearchTerm}
                                        oninput={handlePartSearchChange}>
                                </div>
                            </div>

                            <template if:true={isLoadingParts}>
                                <div class="parts-loading-state">
                                    <lightning-spinner alternative-text="Loading compatible parts" size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template if:true={partsErrorMessage}>
                                <div class="parts-inline-error">
                                    <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                                    <span>{partsErrorMessage}</span>
                                </div>
                            </template>

                            <template if:false={isLoadingParts}>
                                <template if:true={hasCatalogParts}>
                                    <div class="parts-table-wrap">
                                        <table class="parts-table">
                                            <thead>
                                                <tr>
                                                    <th class="parts-select-column"><span class="slds-assistive-text">Select</span></th>
                                                    <th>Part</th>
                                                    <th>Part Number</th>
                                                    <th>Category</th>
                                                    <th>Compatible Model</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={visibleCatalogParts} for:item="part">
                                                    <tr key={part.id}>
                                                        <td class="parts-select-column">
                                                            <input
                                                                type="checkbox"
                                                                class="part-checkbox"
                                                                data-id={part.id}
                                                                checked={part.selected}
                                                                onchange={handlePartSelection}
                                                                aria-label={part.name}>
                                                        </td>
                                                        <td>
                                                            <div class="part-name-cell">
                                                                <div class="part-icon">
                                                                    <lightning-icon icon-name="standard:product_item" size="xx-small"></lightning-icon>
                                                                </div>
                                                                <strong>{part.name}</strong>
                                                            </div>
                                                        </td>
                                                        <td><span class="part-number">{part.partNumber}</span></td>
                                                        <td>{part.category}</td>
                                                        <td>{part.compatibleModel}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>

                                    <div class="parts-pagination-row">
                                        <div class="parts-pagination-summary">
                                            {catalogDisplayCountLabel}
                                        </div>

                                        <div class="parts-pagination-actions">
                                            <template if:true={canShowLessCatalogParts}>
                                                <button
                                                    type="button"
                                                    class="parts-pagination-button"
                                                    onclick={handleShowLessCatalogParts}>
                                                    <lightning-icon
                                                        icon-name="utility:chevronup"
                                                        size="xx-small">
                                                    </lightning-icon>
                                                    Show Less
                                                </button>
                                            </template>

                                            <template if:true={hasMoreCatalogParts}>
                                                <button
                                                    type="button"
                                                    class="parts-pagination-button parts-pagination-button-primary"
                                                    onclick={handleShowMoreCatalogParts}>
                                                    Show More
                                                    <lightning-icon
                                                        icon-name="utility:chevrondown"
                                                        size="xx-small">
                                                    </lightning-icon>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <template if:false={hasCatalogParts}>
                                    <div class="empty-parts-state">
                                        <lightning-icon icon-name="utility:search" size="small"></lightning-icon>
                                        <div>
                                            <strong>No matching catalog parts</strong>
                                            <p>Try a different search term or confirm the manufacturer assigned to this machine.</p>
                                        </div>
                                    </div>
                                </template>
                            </template>
                        </section>

                        <section class="content-card selected-parts-card">
                            <div class="card-header">
                                <div>
                                    <p class="section-kicker selected-parts-kicker">Work Order request</p>
                                    <h3>Selected Parts</h3>
                                    <p class="field-helper">
                                        Set the quantity required for each part. These remain unsaved
                                        until the Work Order is approved.
                                    </p>
                                </div>
                                <div class="part-count-badge">{selectedPartCountLabel}</div>
                            </div>

                            <template if:true={hasSelectedParts}>
                                <div class="selected-parts-list">
                                    <template for:each={selectedParts} for:item="part">
                                        <article key={part.id} class="selected-part-row">
                                            <div class="selected-part-main">
                                                <div class="selected-part-icon">
                                                    <lightning-icon icon-name="standard:product_item" size="small"></lightning-icon>
                                                </div>
                                                <div>
                                                    <strong>{part.name}</strong>
                                                    <div class="selected-part-meta">
                                                        <span>{part.partNumber}</span>
                                                        <span class="meta-dot">•</span>
                                                        <span>{part.category}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="selected-part-actions">
                                                <label class="quantity-field">
                                                    <span>Quantity</span>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        step="1"
                                                        value={part.quantity}
                                                        data-id={part.id}
                                                        onchange={handlePartQuantityChange}>
                                                </label>
                                                <button
                                                    type="button"
                                                    class="remove-part-button"
                                                    data-id={part.id}
                                                    title="Remove part"
                                                    onclick={handleRemovePart}>
                                                    <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                                </button>
                                            </div>
                                        </article>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasSelectedParts}>
                                <div class="empty-selected-parts">
                                    <lightning-icon icon-name="utility:info_alt" size="small"></lightning-icon>
                                    <div>
                                        <strong>No parts selected</strong>
                                        <p>If no parts are required, you can continue directly to Approval.</p>
                                    </div>
                                </div>
                            </template>
                        </section>

                    </main>

                    <footer class="wizard-footer">
                        <button type="button" class="secondary-button" onclick={handleBack}>
                            <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                            Back
                        </button>

                        <button type="button" class="primary-button" onclick={handleContinueToApproval}>
                            Continue to Approval
                            <lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                        </button>
                    </footer>

                </template>

                <!-- =====================================================
                     STEP 4 - APPROVAL
                     ===================================================== -->

                <template if:true={isStepFour}>

                    <main class="wizard-content">

                        <div class="step-heading">
                            <p class="eyebrow">Step 4 of 4</p>
                            <h2>Approval</h2>
                            <p>
                                Review the final repair plan and confirm the Work Order
                                is ready for dispatch preparation.
                            </p>
                        </div>

                        <!-- 1. REPAIR PLAN -->

                        <section class="content-card approval-repair-card approval-flow-card">

                            <div class="approval-flow-title-row">
                                <div class="approval-step-number approval-step-number-repair">1</div>

                                <div class="approval-card-heading approval-flow-heading">
                                    <!-- Final Review -->
                                    <div class="approval-card-icon repair-plan-icon">
                                        <lightning-icon
                                            icon-name="utility:check"
                                            size="small"
                                            alternative-text="Final Review"
                                            class="repair-plan-lightning-icon">
                                        </lightning-icon>
                                    </div>

                                    <div>
                                        <p class="section-kicker approval-repair-kicker">Final Review</p>
                                        <h3>Repair Plan</h3>
                                        <p class="field-helper">
                                            Confirm the technician-facing repair direction before approving the Work Order.
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div class="approval-summary-grid">
                                <div class="approval-summary-item approval-summary-wide">
                                    <span class="approval-summary-label">Problem Summary</span>
                                    <p>{problemSummary}</p>
                                </div>

                                <div class="approval-summary-item approval-summary-wide">
                                    <span class="approval-summary-label">Recommended Fix Summary</span>
                                    <p>{recommendedFixSummary}</p>
                                </div>

                                <div class="approval-summary-item approval-tools-summary">
                                    <div class="approval-summary-row">
                                        <span class="approval-summary-label">Tools to Bring</span>
                                        <span class="approval-count-badge">{approvalToolCountLabel}</span>
                                    </div>

                                    <template if:true={hasRecommendedTools}>
                                        <div class="approval-tool-list">
                                            <template for:each={recommendedTools} for:item="tool">
                                                <span key={tool.id} class="approval-tool-chip">
                                                    <lightning-icon icon-name="utility:setup" size="xx-small"></lightning-icon>
                                                    {tool.name}
                                                </span>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:false={hasRecommendedTools}>
                                        <p class="approval-empty-copy">No tools were identified for this repair.</p>
                                    </template>
                                </div>
                            </div>

                        </section>

                        <!-- ARROW: REPAIR PLAN → PARTS -->
                        <div class="approval-flow-connector" aria-hidden="true">
                            <div class="approval-flow-arrow">
                                <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                            </div>
                        </div>

                        <!-- 2. PARTS REQUEST -->

                        <section class="content-card approval-parts-card approval-flow-card">

                            <div class="approval-flow-title-row approval-card-heading-row">
                                <div class="approval-heading-main">
                                    <div class="approval-step-number approval-step-number-parts">2</div>

                                    <div class="approval-card-icon approval-parts-icon">
                                        <lightning-icon icon-name="standard:product_item" size="small"></lightning-icon>
                                    </div>

                                    <div>
                                        <p class="section-kicker approval-parts-kicker">Parts Request</p>
                                        <h3>Parts</h3>
                                        <p class="field-helper">
                                            These are the catalog parts that will be requested when the Work Order is approved.
                                        </p>
                                    </div>
                                </div>

                                <div class="approval-count-badge approval-part-count">{approvalPartCountLabel}</div>
                            </div>

                            <template if:true={hasSelectedParts}>
                                <div class="approval-parts-list">
                                    <template for:each={selectedParts} for:item="part">
                                        <div key={part.id} class="approval-part-row">
                                            <div class="approval-part-main">
                                                <div class="approval-part-icon">
                                                    <lightning-icon icon-name="standard:product_item" size="xx-small"></lightning-icon>
                                                </div>
                                                <div>
                                                    <strong>{part.name}</strong>
                                                    <div class="approval-part-meta">
                                                        <span>{part.partNumber}</span>
                                                        <span class="meta-dot">•</span>
                                                        <span>{part.category}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="approval-quantity">
                                                <span>Qty</span>
                                                <strong>{part.quantity}</strong>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasSelectedParts}>
                                <div class="approval-empty-parts">
                                    <div class="approval-empty-parts-icon">
                                        <lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon>
                                    </div>
                                    <div>
                                        <strong>No parts required</strong>
                                        <p>No catalog parts were selected for this repair.</p>
                                    </div>
                                </div>
                            </template>

                        </section>

                        <!-- ARROW: PARTS → NEXT STEP -->
                        <div class="approval-flow-connector" aria-hidden="true">
                            <div class="approval-flow-arrow">
                                <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                            </div>
                        </div>

                        <!-- 3. NEXT STEP -->

                        <section class="content-card approval-dispatch-card approval-flow-card">
                            <div class="approval-flow-title-row">
                                <div class="approval-step-number approval-step-number-next">3</div>

                                    <!-- Next Step -->
                                    <div class="approval-card-icon dispatch-icon">
                                        <lightning-icon
                                            icon-name="utility:forward"
                                            size="small">
                                        </lightning-icon>
                                    </div>

                                <div class="approval-dispatch-copy">
                                    <p class="section-kicker dispatch-kicker">Next Step</p>

                                    <template if:true={hasSelectedParts}>
                                        <h3>Order Required Parts</h3>
                                    </template>

                                    <template if:false={hasSelectedParts}>
                                        <h3>Assign a Technician</h3>
                                    </template>

                                    <div class={approvalDispatchClass}>{approvalDispatchStatus}</div>
                                    <p>{approvalDispatchDescription}</p>
                                </div>
                            </div>
                        </section>

                        <template if:true={approvalErrorMessage}>
                            <div class="parts-inline-error approval-error" role="alert">
                                <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                                <span>{approvalErrorMessage}</span>
                            </div>
                        </template>

                        <div class="approval-notice">
                            <lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon>
                            <span>
                                Approving this Work Order will save the reviewed repair plan
                                and create any selected part requests.
                            </span>
                        </div>

                    </main>

                    <footer class="wizard-footer approval-footer">

                        <button
                            type="button"
                            class="secondary-button"
                            onclick={handleCancel}
                            disabled={isApproving}>
                            Cancel
                        </button>

                        <div class="approval-footer-actions">

                            <button
                                type="button"
                                class="secondary-button"
                                onclick={handleBack}
                                disabled={isApproving}>

                                <lightning-icon
                                    icon-name="utility:chevronleft"
                                    size="xx-small">
                                </lightning-icon>

                                Back

                            </button>

                            <button
                                type="button"
                                class="approve-work-order-button"
                                onclick={handleApproveWorkOrder}
                                disabled={isApproveDisabled}>

                                <template if:false={isApproving}>

                                    <lightning-icon
                                        icon-name="utility:success"
                                        size="xx-small">
                                    </lightning-icon>

                                    Approve Work Order

                                </template>

                                <template if:true={isApproving}>

                                    <lightning-icon
                                        icon-name="utility:refresh"
                                        size="xx-small"
                                        class="regenerate-icon regenerate-icon-spinning">
                                    </lightning-icon>

                                    Approving...

                                </template>

                            </button>

                        </div>

                    </footer>

                </template>

            </template>

        </template>



        <template if:true={showRegenerationConfirmation}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                aria-labelledby="regeneration-modal-heading"
                class="slds-modal slds-fade-in-open regeneration-modal">
                <div class="slds-modal__container regeneration-modal-container">
                    <header class="regeneration-modal-header">
                        <div class="regeneration-modal-icon">
                            <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                        </div>
                        <div>
                            <p class="eyebrow">AI Proposal</p>
                            <h2 id="regeneration-modal-heading">Regenerate AI Proposal?</h2>
                        </div>
                    </header>

                    <div class="regeneration-modal-body">
                        <p>
                            This will replace the current AI draft and any
                            unsaved manager edits.
                        </p>

                        <div class="regeneration-warning">
                            <lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon>
                            <span>
                                Your current Problem Summary, Recommended Solution,
                                Fix Summary, Tools, Parts, Priority, and Previous
                                Failure selection will be replaced by a newly
                                generated proposal.
                            </span>
                        </div>
                    </div>

                    <footer class="regeneration-modal-footer">
                        <button type="button" class="secondary-button"
                            onclick={handleCancelRegeneration}>
                            Cancel
                        </button>

                        <button type="button" class="regenerate-confirm-button"
                            onclick={handleConfirmRegeneration}>
                            <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                            Regenerate Proposal
                        </button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showRegenerationFlow}>

            <div class="hidden-flow" aria-hidden="true">
                <lightning-flow
                    flow-api-name="MGR_01_Regenerate_Work_Order_AI_Proposal"
                    flow-input-variables={regenerationFlowInputs}
                    flow-finish-behavior="NONE"
                    onstatuschange={handleRegenerationStatus}>
                </lightning-flow>
            </div>

        </template>

        <!-- =====================================================
            REGENERATION PROCESSING OVERLAY
            ===================================================== -->

        <template if:true={isRegenerating}>

            <div
                class="regeneration-processing-overlay"
                role="status"
                aria-live="polite">

                <div class="regeneration-processing-card">

                    <div class="regeneration-spinner-wrap">

                        <lightning-spinner
                            alternative-text="Regenerating AI proposal"
                            size="medium">
                        </lightning-spinner>

                    </div>

                    <h2>Regenerating AI Proposal</h2>

                    <p>
                        Reviewing the Work Order, historical repairs,
                        and service guidance.
                    </p>

                    <span class="regeneration-processing-note">
                        Your updated proposal will appear shortly.
                    </span>

                </div>

            </div>

        </template>

        <!-- =====================================================
             APPROVAL PROCESSING OVERLAY
             ===================================================== -->

        <template if:true={isApproving}>

            <div
                class="regeneration-processing-overlay"
                role="status"
                aria-live="polite">

                <div class="regeneration-processing-card">

                    <div class="regeneration-spinner-wrap">
                        <lightning-spinner
                            alternative-text="Approving Work Order"
                            size="medium">
                        </lightning-spinner>
                    </div>

                    <h2>Approving Work Order</h2>

                    <p>
                        Saving the reviewed repair plan and creating
                        any required part requests.
                    </p>

                    <span class="regeneration-processing-note">
                        Please keep this page open while approval completes.
                    </span>

                </div>

            </div>

        </template>

    </div>

</template>
