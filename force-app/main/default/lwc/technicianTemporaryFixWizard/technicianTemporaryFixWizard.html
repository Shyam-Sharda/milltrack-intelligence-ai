<template>

    <!-- LOADING -->
    <template if:true={isLoading}>
        <div class="wizard">
            <div class="loading-state">
                <lightning-spinner alternative-text="Loading Temporary Repair" size="medium"></lightning-spinner>
                <p>Preparing the Work Order...</p>
            </div>
        </div>
    </template>

    <!-- INITIAL ERROR -->
    <template if:true={isInitialError}>
        <div class="state-shell">
            <div class="state-card error-state">
                <div class="state-icon">
                    <lightning-icon icon-name="utility:warning" size="small" variant="inverse"></lightning-icon>
                </div>

                <h2>Temporary Repair Unavailable</h2>
                <p>{errorMessage}</p>

                <button class="white-button error-button" onclick={handleClose}>
                    Close
                </button>
            </div>
        </div>
    </template>

    <!-- MAIN FORM -->
    <template if:true={showForm}>
        <div class="wizard">

            <!-- HEADER -->
            <div class="wizard-header">
                <div>
                    <p class="eyebrow">TECHNICIAN SERVICE</p>
                    <h1>Temporary Fix &amp; Follow-Up</h1>
                    <p class="header-subtitle">
                        Document this service visit before returning the Work Order for manager follow-up.
                    </p>
                </div>

                <div class="follow-up-badge">Follow-Up Required</div>
            </div>

            <!-- WORK ORDER CONTEXT -->
            <div class="context-card">

                <div class="context-icon">
                    <lightning-icon icon-name="standard:work_order" size="small"></lightning-icon>
                </div>

                <div class="context-main">
                    <span class="context-label">WORK ORDER</span>
                    <strong>{context.workOrderNumber}</strong>
                    <span class="context-subject">{context.subject}</span>
                </div>

                <div class="machine-context">
                    <span class="context-label">MACHINE</span>
                    <strong>{context.assetName}</strong>
                    <span>{machineDetails}</span>
                </div>

                <div class="labor-context">
                    <span class="context-label">CURRENT WO LABOR</span>
                    <strong>{currentLaborLabel}</strong>
                    <span>Before this visit</span>
                </div>

            </div>

            <!-- VISIT -->
            <section class="form-content">

                <div class="section-heading">

                    <div class="heading-icon">
                        <lightning-icon icon-name="utility:note" size="x-small" variant="inverse"></lightning-icon>
                    </div>

                    <div>
                        <h2>Document Current Visit</h2>
                        <p>Record why the machine requires follow-up after today's work.</p>
                    </div>

                </div>

                <!-- SUMMARY -->
                <lightning-textarea
                    class="form-input summary-input"
                    label="Visit Summary"
                    value={visitSummary}
                    required
                    maxlength="32768"
                    placeholder="Describe what you found and worked on, why the issue could not be permanently resolved, any temporary repair you performed, and what follow-up is needed."
                    onchange={handleSummaryChange}>
                </lightning-textarea>

                <div class="summary-help">
                    Include the work performed, why permanent resolution was not possible, any temporary repair applied, and the recommended follow-up.
                </div>

                <!-- LABOR -->
                <div class="labor-section">

                    <lightning-input
                        class="form-input labor-input"
                        type="number"
                        label="Labor Hours for This Visit"
                        min="0.25"
                        step="0.25"
                        value={laborHours}
                        required
                        onchange={handleLaborChange}>
                    </lightning-input>

                    <div class="labor-help">
                        Enter labor for this visit only. It will be added to the Work Order's cumulative labor.
                    </div>

                </div>

                <!-- NEXT STEP -->
                <div class="next-step-card">

                    <div class="next-icon">
                        <lightning-icon icon-name="utility:forward" size="x-small" variant="inverse"></lightning-icon>
                    </div>

                    <div>
                        <strong>What happens next?</strong>

                        <p>
                            This visit will be recorded as a <strong>Temporary Repair</strong>.
                            The machine will be marked <strong>Temporary Fix Applied</strong>,
                            the related Case will move to <strong>Follow-Up Required</strong>,
                            and the Work Order will return to manager coordination as
                            <strong>Temporary Fix</strong>.
                        </p>
                    </div>

                </div>

                <template if:true={inlineError}>
                    <div class="inline-error">{inlineError}</div>
                </template>

            </section>

            <!-- FOOTER -->
            <footer class="wizard-footer">

                <button
                    class="secondary-button"
                    onclick={handleClose}
                    disabled={isSubmitting}>
                    Cancel
                </button>

                <button
                    class="primary-button submit-button"
                    onclick={handleSubmit}
                    disabled={isSubmitting}>

                    <template if:true={isSubmitting}>
                        Saving...
                    </template>

                    <template if:false={isSubmitting}>
                        Save Temporary Fix
                    </template>

                </button>

            </footer>

        </div>
    </template>

    <!-- SUCCESS -->
    <template if:true={isSuccess}>
        <div class="state-shell">

            <div class="state-card success-state">

                <div class="state-icon">
                    <lightning-icon icon-name="utility:success" size="small" variant="inverse"></lightning-icon>
                </div>

                <h2>Temporary Repair Recorded</h2>

                <div class="status-pill">
                    Follow-Up Required
                </div>

                <p class="success-main">
                    The temporary repair and service visit have been added to the machine's maintenance history.
                </p>

                <p class="success-sub">
                    The Work Order has been returned to manager coordination for follow-up.
                </p>

                <template if:true={notificationWarning}>
                    <div class="notification-warning">

                        <lightning-icon
                            icon-name="utility:warning"
                            size="x-small"
                            variant="inverse">
                        </lightning-icon>

                        <span>{notificationWarning}</span>

                    </div>
                </template>

                <div class="opening-log-message">

                    <lightning-spinner
                        alternative-text="Opening Maintenance Log"
                        size="small">
                    </lightning-spinner>

                    <span>Opening Maintenance Log...</span>

                </div>

                <button
                    class="white-outline-button open-log-button"
                    onclick={handleOpenMaintenanceLog}>
                    Open Maintenance Log Now
                </button>

            </div>

        </div>
    </template>

    <!-- SUBMIT ERROR -->
    <template if:true={isSubmitError}>
        <div class="state-shell">

            <div class="state-card error-state">

                <div class="state-icon">
                    <lightning-icon
                        icon-name="utility:warning"
                        size="small"
                        variant="inverse">
                    </lightning-icon>
                </div>

                <h2>Temporary Repair Not Saved</h2>

                <p>{errorMessage}</p>

                <p class="error-subtext">
                    No changes were saved. You can return to the visit and try again.
                </p>

                <button
                    class="white-button error-button"
                    onclick={handleReturnToForm}>
                    Return to Visit
                </button>

            </div>

        </div>
    </template>

</template>
